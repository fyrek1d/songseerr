services:
  mediaseer:
    build: .
    container_name: mediaseer
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/mediaseer.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - CRON_SECRET=${CRON_SECRET:-cron-secret}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-webhook-secret}
      - SEED_ADMIN_USERNAME=${SEED_ADMIN_USERNAME:-admin}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@localhost}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin12345}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"