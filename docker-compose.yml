services:
  mediaseer-demo:
    build: .
    container_name: mediaseer-demo
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=file:/data/mediaseer-demo.db
      - NEXTAUTH_SECRET=mediaseer-demo-secret
      - NEXTAUTH_URL=https://demo.fyrek.dev
      - NEXT_PUBLIC_APP_URL=https://demo.fyrek.dev
      - CRON_SECRET=mediaseer-demo-cron-secret
      - WEBHOOK_SECRET=mediaseer-demo-webhook-secret
      - DEMO_MODE=true
    volumes:
      - /opt/stack/data/mediaseer-demo/data:/data
    networks:
      - mediaseer-demo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mediaseer-demo-proxy:
    image: nginx:alpine
    container_name: mediaseer-demo-proxy
    depends_on:
      - mediaseer-demo
    volumes:
      - ./nginx-demo.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mediaseer-demo-net
      - web
    restart: unless-stopped

networks:
  mediaseer-demo-net:
    name: mediaseer-demo_mediaseer-demo-net
    driver: bridge
  web:
    external: true
